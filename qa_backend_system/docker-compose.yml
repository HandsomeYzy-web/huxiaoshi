version: '3.8'

services:
  # ==========================================
  # 1. MySQL 数据库 (用于存储会话、知识库元数据)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: qa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root  # 设置数据库 root 密码
      MYSQL_DATABASE: qa_system  # 启动时自动创建一个名为 qa_system 的库
      TZ: Asia/Shanghai          # 设置时区为东八区
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql # 数据持久化

  # ==========================================
  # 2. Milvus 及其依赖 (etcd, minio)
  # ==========================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    # 修改点：广播地址改为 http://etcd:2379，监听地址为 0.0.0.0
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin      # 推荐使用 ROOT_USER
      MINIO_ROOT_PASSWORD: minioadmin  # 推荐使用 ROOT_PASSWORD
    ports:
      - "9001:9001" # 控制台端口
      - "9000:9000" # API 端口
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 修改点：Milvus 必须知道 MinIO 的账密才能连接
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET_NAME: a-bucket # Milvus 默认使用的 bucket 名称
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530" # Milvus 核心服务端口 (Python 连这个)
      - "9091:9091"   # Milvus 管理端口
    depends_on:
      - etcd
      - minio

  # ==========================================
  # 3. Milvus 可视化管理工具 (Attu)
  # ==========================================
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4.0
    environment:
      MILVUS_URL: milvus:19530 # 让 Attu 在 Docker 内部直接连接 milvus 服务
    ports:
      - "8001:3000"            # 本地通过 8001 端口访问浏览器 GUI
    depends_on:
      - milvus

# ==========================================
  # 4. Redis 缓存与消息队列
  # ==========================================
  redis:
    image: redis:7.2  # 推荐使用较新的稳定版本
    container_name: qa_redis
    # 启动命令：开启 AOF 持久化，并设置访问密码（非常重要，防止被恶意扫描）
    command: redis-server --appendonly yes --requirepass root1234
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # 持久化数据目录

# ==========================================
# 声明上面用到的所有数据卷（挂载点）
# ==========================================
volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data: