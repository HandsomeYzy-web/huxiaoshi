version: '3.8'

services:
  # ==========================================
  # 1. MySQL 数据库 (用于存储会话、知识库元数据)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: qa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root  # 设置数据库 root 密码
      MYSQL_DATABASE: qa_system  # 启动时自动创建一个名为 qa_system 的库
      TZ: Asia/Shanghai          # 设置时区为东八区
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql # 数据持久化

  # ==========================================
  # 2. MinIO 对象存储 (存储知识库源文件)
  # ==========================================
  minio:
    container_name: qa_minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin      # 与 .env 中 MINIO_ACCESS_KEY 保持一致
      MINIO_ROOT_PASSWORD: minioadmin  # 与 .env 中 MINIO_SECRET_KEY 保持一致
    ports:
      - "9001:9001" # 控制台端口
      - "9000:9000" # API 端口
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  # ==========================================
  # 3. Elasticsearch 向量数据库
  # ==========================================
  # 注意：indexed dense_vector 维度上限为 4096（ES 8.11+），
  # e5-mistral-7b 等 4096 维模型需使用 8.11 及以上版本。
  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: qa_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true                 # 开启安全认证（生产必须）
      - xpack.security.http.ssl.enabled=false       # HTTP 层暂不启用 TLS：认证走内网 http，下一步再上证书
      - ELASTIC_PASSWORD=${ES_PASSWORD}             # elastic 超级用户密码，从同目录 .env 注入
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  # 按需调整堆内存
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200" # REST API 端口 (Python 连这个)
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ==========================================
  # 4. Kibana 可视化管理工具 (替代原 Attu)
  # ==========================================
  kibana:
    image: kibana:8.15.0
    container_name: qa_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # ES 开认证后 Kibana 必须带凭据。这里图省事用 elastic 超级用户；
      # 更严格的生产应改用 kibana_system 专用账号，或干脆不部署 Kibana。
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "5601:5601"            # 本地通过 5601 端口访问浏览器 GUI
    depends_on:
      - elasticsearch

  # ==========================================
  # 5. Redis 缓存与消息队列
  # ==========================================
  redis:
    image: redis:7.2  # 推荐使用较新的稳定版本
    container_name: qa_redis
    # 启动命令：开启 AOF 持久化，并设置访问密码（非常重要，防止被恶意扫描）
    command: redis-server --appendonly yes --requirepass root1234
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # 持久化数据目录

# ==========================================
# 声明上面用到的所有数据卷（挂载点）
# ==========================================
volumes:
  mysql_data:
  minio_data:
  es_data:
  redis_data:
